name: Native platforms

on: [pull_request, push]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux document parser and native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 poppler-utils
      - name: macOS document parser
        if: runner.os == 'macOS'
        run: brew install poppler
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm release:pack
      - run: pnpm test
      - run: pnpm test:native
      - run: pnpm check:i18n
      - run: pnpm exec playwright install --with-deps chrome
      - run: pnpm test:browser tests/browser/execution.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: release-bundle
          path: .amp/in/artifacts/release/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-${{ runner.os }}
          path: .amp/in/artifacts/
          include-hidden-files: true
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the verified release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name release-bundle --dir release
      - name: Publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" teach-me-coding-*.tar.gz SHA256SUMS \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Release version ${GITHUB_REF_NAME#v}." --latest
